name: Probar bot en vivo

on:
  push:
    branches: [claude/project-thread-1ao83h]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Mandar pedidos de prueba al Worker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          SECRETO=$(printf '%s' "webhook:$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          URL=https://bondicaba.schffn.workers.dev/telegram
          mandar() {
            curl -sS -m 30 -o r.json -w '[%{http_code} %{time_total}s]\n' -H "X-Telegram-Bot-Api-Secret-Token: $SECRETO" -H 'Content-Type: application/json' -d @- "$URL"
            jq -r '.text // .' r.json 2>/dev/null || cat r.json
          }
          probar() {
            echo "=================== $1"
            jq -n --arg t "$1" '{update_id: 1, message: {message_id: 1, chat: {id: 1}, text: $t}}' | mandar
          }
          probar "/start"
          probar "quiero ir de Corrientes 800 a Plaza Italia"
          probar "de Cabildo y Juramento al Obelisco"
          probar "cómo llego a Rivadavia 6300 desde Constitución"
          probar "de Defensa 500 a Cabildo 2000"
          probar "de Retiro a La Boca"
          probar "de Av. Santa Fe 3200 a Av. Rivadavia 4500"
          probar "de Liniers a Plaza de Mayo"
          probar "de Belgrano y Perú a Medrano y Corrientes"
          probar "de Hospital Italiano a Facultad de Medicina"
          probar "de Estación Once a Parque Centenario"
          probar "de Lanús a Obelisco"
          probar "hola"
          echo "=================== ubicación"
          jq -n '{update_id: 1, message: {message_id: 1, chat: {id: 1}, location: {latitude: -34.6083, longitude: -58.3712}}}' | mandar
          jq -n '{update_id: 1, message: {message_id: 2, chat: {id: 1}, text: "Parque Lezama", reply_to_message: {text: "Salida: -34.60830, -58.37120"}}}' | mandar
          echo "=================== sin secreto"
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST -d '{}' "$URL"
