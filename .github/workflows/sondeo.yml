name: Sondeo de datos

on:
  push:
    branches: [claude/project-thread-1ao83h]

jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes
        run: |
          for u in \
            "https://cdn.buenosaires.gob.ar/datosabiertos/datasets/transporte-y-obras-publicas/colectivos-gtfs/colectivos-gtfs.zip" \
            "https://files.mobilitydatabase.org/mdb-1220/latest.zip" \
            "https://hub.tumidata.org/api/3/action/package_show?id=buses_gtfs_frequency_buenos_aires" \
            "https://datos.transporte.gob.ar/dataset/colectivos-gtfs" \
            "https://apitransporte.buenosaires.gob.ar/colectivos/feed-gtfs" \
            "https://api.mobilitydatabase.org/v1/metadata" ; do
            echo "== $u"
            curl -sSL -m 120 -A "Mozilla/5.0" -o salida.bin -w "%{http_code} %{size_download} %{content_type}\n" "$u" || true
            head -c 600 salida.bin | tr -cd '[:print:]\n' ; echo
            file salida.bin || true
          done
      - name: TUMI recursos
        run: |
          curl -sSL -m 60 "https://hub.tumidata.org/api/3/action/package_show?id=buses_gtfs_frequency_buenos_aires" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r.get('name'),r.get('url'),r.get('last_modified') or r.get('created')) for r in d['result']['resources']]" || true
      - name: Mobility Database
        run: |
          curl -sSL -m 60 "https://files.mobilitydatabase.org/mdb-1220/latest.zip" -o mdb.zip -w "%{http_code} %{size_download}\n" || true
          unzip -l mdb.zip 2>/dev/null | head -20 || true
          unzip -p mdb.zip feed_info.txt 2>/dev/null | head -3 || true
          unzip -p mdb.zip calendar_dates.txt 2>/dev/null | head -5 || true
