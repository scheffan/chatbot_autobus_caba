<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bondi CABA</title>
  <meta name="description" content="Cómo llegar en colectivo por Buenos Aires: escribís de dónde y adónde, y te dice qué bondi tomar." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <header class="encabezado">
        <h1>🚌 Bondi CABA</h1>
        <p>Escribí de dónde salís y adónde vas, o tocá el mapa.</p>
      </header>

      <form id="formulario" class="formulario" autocomplete="off">
        <label>
          <span>Desde</span>
          <div class="fila">
            <input id="origen" placeholder="Corrientes 800, Obelisco, Cabildo y Juramento…" required />
            <button type="button" id="ubicacion" class="icono" title="Usar mi ubicación">📍</button>
          </div>
        </label>
        <label>
          <span>Hasta</span>
          <input id="destino" placeholder="Plaza Italia, Rivadavia 6300…" required />
        </label>
        <button type="submit" id="buscar" class="principal">Buscar colectivos</button>
      </form>

      <p id="estado" class="estado" role="status">Cargando la red de colectivos…</p>
      <div id="resultados" class="resultados"></div>

      <footer class="pie">
        <p>También en Telegram: <a href="https://t.me/bondicaba_bot" target="_blank" rel="noopener">@bondicaba_bot</a></p>
        <p>Datos: GTFS de colectivos de <a href="https://data.buenosaires.gob.ar/dataset/colectivos-gtfs" target="_blank" rel="noopener">Buenos Aires Data</a> y lugares de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>. Los tiempos son estimados.</p>
        <p><a href="https://github.com/scheffan/chatbot_autobus_caba" target="_blank" rel="noopener">Código en GitHub</a></p>
      </footer>
    </section>
    <section id="mapa" class="mapa" aria-label="Mapa"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
